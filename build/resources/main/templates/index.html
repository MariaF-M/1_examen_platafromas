<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <title>UPB Tareas (JPA)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-8">
            <h2 class="text-center mb-4">Gestor de Tareas (Spring Data JPA)</h2>

            <div class="card p-3 mb-4 shadow-sm">
                <form th:action="@{/guardar}" th:object="${nuevaTarea}" method="post" class="input-group">
                    <input type="text" th:field="*{descripcion}" class="form-control" placeholder="Nueva tarea..."
                        required>
                    <button type="submit" class="btn btn-success">Guardar</button>
                </form>
            </div>

            <div class="list-group">
                <div th:each="tarea : ${tareas}"
                    class="list-group-item d-flex justify-content-between align-items-center">
                    <div>
                        <span class="fw-bold" th:text="${tarea.id}">#</span>
                        <span th:text="${tarea.descripcion}" class="ms-2">Descripción</span>
                    </div>
                    <a th:href="@{/eliminar/{id}(id=${tarea.id})}" class="btn btn-outline-danger btn-sm">Eliminar</a>
                </div>

                <div th:if="${#lists.isEmpty(tareas)}" class="alert alert-secondary text-center">
                    Base de datos vacía. ¡Agrega una tarea!
                </div>
            </div>
        </div>
    </div>
</body>

</html>
